<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 620" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Solid Drop Shadow for 3D Typography -->
    <filter id="chunky3D" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
      <feDropShadow dx="7" dy="8" stdDeviation="2" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Circular Badge Gradients -->
    <radialGradient id="badgeDiscGrad" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#ff7a3d" />
      <stop offset="60%" stop-color="#ff5500" />
      <stop offset="90%" stop-color="#e03800" />
      <stop offset="100%" stop-color="#b82800" />
    </radialGradient>

    <!-- Tropical Leaves Gradients -->
    <linearGradient id="leafGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="leafGradRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Badge Drop Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00d2ff" flood-opacity="0.9" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;family=Outfit:ital,wght@1,500&amp;family=Syne:wght@800;900&amp;display=swap');
    .brand-serif {
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-weight: 900;
    }
    .brand-tagline {
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.2em;
    }
    .badge-sans {
      font-family: 'Syne', 'Outfit', sans-serif;
      font-weight: 900;
    }
  </style>

  <!-- ================= BACKGROUND (Transparent or Deep canvas) ================= -->
  <rect width="100%" height="100%" fill="#000000" rx="20" />

  <!-- ================= CIRCULAR EMBLEM BADGE (Top-Right of "Soul") ================= -->
  <g id="emblem-badge" transform="translate(465, 140)" filter="url(#badgeShadow)">
    <!-- Painted Brush Disc -->
    <circle cx="0" cy="0" r="88" fill="url(#badgeDiscGrad)" />
    
    <!-- Organic Brush Outer Rim -->
    <path d="M-84,-24 C-90,-8 -89,22 -78,47 C-66,70 -37,88 -8,90 C21,91 52,82 72,62 C92,42 93,14 86,-21 C81,-50 60,-74 37,-86 C8,-96 -31,-92 -58,-76 C-74,-66 -82,-44 -84,-24 Z" fill="#ff5500" opacity="0.6" />
    <path d="M-73,-41 C-84,-15 -78,29 -62,58 C-43,83 -4,92 24,86 C58,78 82,52 84,17 C86,-16 72,-58 43,-78 C13,-92 -44,-88 -73,-41 Z" fill="#d83600" opacity="0.4" />
    <!-- Dynamic splatters -->
    <circle cx="-86" cy="17" r="3.5" fill="#ff6b2b" />
    <circle cx="83" cy="-27" r="2.8" fill="#ff7a3d" />
    <circle cx="-60" cy="72" r="2.5" fill="#ff5500" />
    <circle cx="70" cy="56" r="3.2" fill="#e03800" />

    <!-- Tropical Foliage -->
    <g id="foliage" opacity="0.9">
      <path d="M-62,11 C-56,-31 -15,-56 8,-52 C-2,-33 -11,-9 -21,17 C-41,23 -55,19 -62,11 Z" fill="url(#leafGradLeft)" />
      <path d="M-43,-23 C-33,-19 -23,-21 -13,-29" stroke="#bbf7d0" stroke-width="1.8" stroke-linecap="round" />
      <path d="M-37,2 C-27,4 -17,2 -9,-6" stroke="#bbf7d0" stroke-width="1.8" stroke-linecap="round" />

      <path d="M54,-17 C50,25 17,52 -11,44 C2,25 13,2 21,-27 C40,-29 50,-25 54,-17 Z" fill="url(#leafGradRight)" />
      <path d="M41,11 C31,9 21,11 13,19" stroke="#bbf7d0" stroke-width="1.8" stroke-linecap="round" />
      <path d="M35,-11 C25,-9 17,-11 9,-3" stroke="#bbf7d0" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Breakdancer Figure (Mid-Air Power Freeze) -->
    <g id="dancer" transform="translate(0, 4) scale(0.95)">
      <!-- Head and Locs -->
      <circle cx="-2" cy="-55" r="10" fill="#18181b" />
      <path d="M-10,-57 C-8,-65 4,-65 6,-57 C2,-55 -6,-55 -10,-57 Z" fill="#ff5500" />
      <path d="M-9,-53 C-14,-49 -13,-44 -9,-41" stroke="#18181b" stroke-width="3" stroke-linecap="round" />

      <!-- Fitted Athletic White Tank Top -->
      <path d="M-12,-45 C-5,-48 6,-48 13,-45 L11,-21 C5,-19 -5,-19 -11,-21 Z" fill="#ffffff" />
      <path d="M0,-44 L0,-22" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

      <!-- Muscular Arms in Freeze -->
      <path d="M-12,-43 C-24,-47 -32,-34 -30,-24 C-28,-17 -22,-21 -18,-29" fill="none" stroke="#1c1917" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-15" cy="-47" r="4.5" fill="#1c1917" />
      <path d="M13,-43 C25,-51 32,-41 27,-28 C23,-18 19,-23 15,-31" fill="none" stroke="#1c1917" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="27" cy="-50" r="4.5" fill="#1c1917" />

      <!-- Baggy Charcoal Cargo Joggers -->
      <path d="M-12,-21 C-5,-19 5,-19 13,-21 L17,-9 L-17,-9 Z" fill="#111827" />
      <!-- Left Leg Kicked Up -->
      <path d="M-12,-11 C-26,6 -45,13 -58,17 C-62,18 -64,11 -58,7 C-42,-1 -26,-4 -10,-11 Z" fill="#1f2937" />
      <!-- Left Sneaker -->
      <path d="M-60,19 L-72,22 C-75,19 -73,13 -68,11 L-56,13 Z" fill="#ffffff" />
      <path d="M-72,22 L-62,25" stroke="#ff5500" stroke-width="3" stroke-linecap="round" />

      <!-- Right Leg Bent -->
      <path d="M9,-11 C19,3 27,19 31,37 C25,39 19,33 15,19 C11,6 7,-1 5,-11 Z" fill="#1f2937" />
      <!-- Right Sneaker -->
      <path d="M31,37 L35,49 C31,53 25,51 23,45 L25,35 Z" fill="#ffffff" />
      <path d="M35,49 L27,53" stroke="#ff5500" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Curved Text: "SOUL DANCE STUDIO" -->
    <path id="svgBadgeArcTop" d="M -71,-14 A 72 72 0 0 1 71,-14" fill="none" stroke="none" />
    <text class="badge-sans" font-size="11.5" fill="#38bdf8" letter-spacing="0.16em" filter="url(#cyanGlow)">
      <textPath href="#svgBadgeArcTop" startOffset="50%" text-anchor="middle">
        SOUL DANCE STUDIO
      </textPath>
    </text>

    <!-- Curved Text: "LETS GROW TOGETHER" -->
    <path id="svgBadgeArcBottom" d="M 67,31 A 73 73 0 0 1 -67,31" fill="none" stroke="none" />
    <text class="badge-sans" font-size="8.5" fill="#ffffff" letter-spacing="0.22em" opacity="0.95">
      <textPath href="#svgBadgeArcBottom" startOffset="50%" text-anchor="middle">
        LETS GROW TOGETHER
      </textPath>
    </text>
  </g>

  <!-- ================= OFFICIAL 3-LINE TYPOGRAPHY ================= -->
  <!-- Line 1: "Soul" (White S, Lime-Yellow oul) -->
  <g id="text-soul" filter="url(#chunky3D)">
    <text x="50" y="170" class="brand-serif" font-size="140" fill="#ffffff" letter-spacing="-0.02em">S</text>
    <text x="145" y="170" class="brand-serif" font-size="140" fill="#ddf300" letter-spacing="-0.02em">oul</text>
  </g>

  <!-- Line 2: "Dance" (Lime-Yellow) -->
  <g id="text-dance" filter="url(#chunky3D)">
    <text x="46" y="295" class="brand-serif" font-size="142" fill="#ddf300" letter-spacing="-0.03em">Dance</text>
  </g>

  <!-- Line 3: "Studio" (White S, Lime-Yellow tudio) -->
  <g id="text-studio" filter="url(#chunky3D)">
    <text x="50" y="420" class="brand-serif" font-size="140" fill="#ffffff" letter-spacing="-0.02em">S</text>
    <text x="150" y="420" class="brand-serif" font-size="140" fill="#ddf300" letter-spacing="-0.02em">tudio</text>
  </g>

  <!-- Tagline: "Lets grow together" -->
  <g id="text-tagline">
    <text x="52" y="485" class="brand-tagline" font-size="28" fill="#e2e8f0" opacity="0.95">
      Lets grow together
    </text>
  </g>
</svg>
