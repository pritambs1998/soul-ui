<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="badgeCyanGlowFav" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00d2ff" flood-opacity="0.8" />
    </filter>
    <filter id="badgeShadowFav" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="dancerShadowFav" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Orange Circular Disc Gradients -->
    <radialGradient id="badgeDiscGradFav" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#ff7a3d" />
      <stop offset="60%" stop-color="#ff5500" />
      <stop offset="90%" stop-color="#e03800" />
      <stop offset="100%" stop-color="#b82800" />
    </radialGradient>

    <!-- Tropical Leaves Gradients -->
    <linearGradient id="leafGradLeftFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="leafGradRightFav" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <g transform="translate(100, 100)" filter="url(#badgeShadowFav)">
    <!-- Painted Brush-Stroke Circular Disc -->
    <circle cx="0" cy="0" r="90" fill="url(#badgeDiscGradFav)" />

    <!-- Textured Brush Edges & Organic Splatters -->
    <path
      d="M-86,-25 C-92,-8 -91,22 -80,48 C-68,72 -38,90 -8,92 C22,93 54,84 74,64 C94,44 95,14 88,-22 C83,-52 62,-76 38,-88 C8,-98 -32,-94 -60,-78 C-76,-68 -84,-45 -86,-25 Z"
      fill="#ff5500"
      opacity="0.55"
    />
    <path
      d="M-75,-42 C-86,-15 -80,30 -64,60 C-44,85 -4,94 25,88 C60,80 84,54 86,18 C88,-16 74,-60 44,-80 C14,-94 -45,-90 -75,-42 Z"
      fill="#d83600"
      opacity="0.35"
    />
    <!-- Paint splatters -->
    <circle cx="-88" cy="18" r="3.5" fill="#ff6b2b" />
    <circle cx="85" cy="-28" r="2.8" fill="#ff7a3d" />
    <circle cx="-62" cy="74" r="2.5" fill="#ff5500" />
    <circle cx="72" cy="58" r="3.2" fill="#e03800" />

    <!-- Tropical Monstera Leaves Flanking Left and Right -->
    <g id="tropicalFoliageFav" opacity="0.9">
      <path
        d="M-64,12 C-58,-32 -16,-58 8,-54 C-2,-34 -12,-10 -22,18 C-42,24 -56,20 -64,12 Z"
        fill="url(#leafGradLeftFav)"
      />
      <path d="M-44,-24 C-34,-20 -24,-22 -14,-30" stroke="#bbf7d0" stroke-width="1.8" stroke-linecap="round" />
      <path d="M-38,2 C-28,4 -18,2 -10,-6" stroke="#bbf7d0" stroke-width="1.8" stroke-linecap="round" />

      <path
        d="M56,-18 C52,26 18,54 -12,46 C2,26 14,2 22,-28 C42,-30 52,-26 56,-18 Z"
        fill="url(#leafGradRightFav)"
      />
      <path d="M42,12 C32,10 22,12 14,20" stroke="#bbf7d0" stroke-width="1.8" stroke-linecap="round" />
      <path d="M36,-12 C26,-10 18,-12 10,-4" stroke="#bbf7d0" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Street Dancer Silhouette (Air Freeze) -->
    <g id="dancerFigureFav" transform="translate(0, 4) scale(0.96)" filter="url(#dancerShadowFav)">
      <circle cx="-2" cy="-56" r="10.5" fill="#18181b" />
      <path d="M-10,-58 C-8,-66 4,-66 6,-58 C2,-56 -6,-56 -10,-58 Z" fill="#ff5500" />
      <path d="M-9,-54 C-14,-50 -13,-45 -9,-42" stroke="#18181b" stroke-width="3" stroke-linecap="round" />

      <!-- Athletic White Tank Top -->
      <path d="M-13,-46 C-5,-49 6,-49 13,-46 L11,-21 C5,-19 -5,-19 -11,-21 Z" fill="#ffffff" />
      <path d="M0,-45 L0,-22" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

      <!-- Arms in Freeze -->
      <path d="M-13,-44 C-25,-48 -33,-35 -31,-25 C-29,-18 -23,-22 -19,-30" fill="none" stroke="#1c1917" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-16" cy="-48" r="4.5" fill="#1c1917" />
      <path d="M13,-44 C25,-52 32,-42 27,-29 C23,-19 19,-24 15,-32" fill="none" stroke="#1c1917" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="28" cy="-51" r="4.5" fill="#1c1917" />

      <!-- Cargo Joggers -->
      <path d="M-13,-21 C-5,-19 5,-19 13,-21 L17,-9 L-17,-9 Z" fill="#111827" />
      <path d="M-13,-11 C-27,6 -46,13 -59,17 C-63,18 -65,11 -59,7 C-42,-1 -27,-4 -11,-11 Z" fill="#1f2937" />
      <!-- Left Sneaker -->
      <path d="M-61,19 L-73,22 C-76,19 -74,13 -69,11 L-57,13 Z" fill="#ffffff" />
      <path d="M-73,22 L-62,25" stroke="#ff5500" strokeWidth="3.2" stroke-linecap="round" />

      <!-- Right Leg -->
      <path d="M9,-11 C19,3 27,19 31,37 C25,39 19,33 15,19 C11,6 7,-1 5,-11 Z" fill="#1f2937" />
      <!-- Right Sneaker -->
      <path d="M31,37 L35,49 C31,53 25,51 23,45 L25,35 Z" fill="#ffffff" />
      <path d="M35,49 L27,53" stroke="#ff5500" strokeWidth="3.2" stroke-linecap="round" />
    </g>

    <!-- Curved Text: "SOUL DANCE STUDIO" -->
    <path id="badgeArcTopFav" d="M -73,-14 A 74 74 0 0 1 73,-14" fill="none" stroke="none" />
    <text font-family="'Syne', 'Outfit', sans-serif" font-weight="900" font-size="11.5" fill="#38bdf8" letter-spacing="0.16em" filter="url(#badgeCyanGlowFav)">
      <textPath href="#badgeArcTopFav" startOffset="50%" text-anchor="middle">
        SOUL DANCE STUDIO
      </textPath>
    </text>

    <!-- Curved Text: "LETS GROW TOGETHER" -->
    <path id="badgeArcBottomFav" d="M 69,32 A 75 75 0 0 1 -69,32" fill="none" stroke="none" />
    <text font-family="'Syne', 'Outfit', sans-serif" font-weight="800" font-size="8.5" fill="#ffffff" letter-spacing="0.22em" opacity="0.95">
      <textPath href="#badgeArcBottomFav" startOffset="50%" text-anchor="middle">
        LETS GROW TOGETHER
      </textPath>
    </text>
  </g>
</svg>
